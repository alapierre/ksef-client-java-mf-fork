signing:
  active: NEVER

release:
  github:
    enabled: true
    skipTag: true
    skipRelease: false
    uploadAssets: NEVER
    owner: alapierre
    name: ksef-client-java-mf-fork
    prerelease:
      pattern: '.*-.*'
    makeLatest: legacy

deploy:
  maven:
    pomchecker:
      # Keep in sync with .github/scripts/setup-pomchecker.sh.
      version: 1.15.0
    mavenCentral:
      app:
        active: ALWAYS
        sign: false
        verifyPom: true
        url: https://central.sonatype.com/api/v1/publisher
        stagingRepositories:
          - ./target/staging-deploy
