name: KSeF TEST integration (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow sends one invoice to KSeF TEST. It is never a release prerequisite.
concurrency:
  group: ksef-test-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run local and live tests
        env:
          KSEF_TOKEN: ${{ secrets.KSEF_TOKEN }}
          KSEF_NIP: ${{ secrets.KSEF_NIP }}
        run: ./mvnw -B -ntp -Pksef-live clean verify
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksef-live-test-reports
          path: |
            **/target/surefire-reports/
            ksef-client/target/failsafe-reports/
          if-no-files-found: ignore
