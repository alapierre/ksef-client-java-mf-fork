name: Release to Maven Central (JReleaser)

on:
  push:
    tags:
      - "v2.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v2.3.15"
        required: true
        type: string
      dry_run:
        description: "Build and sign artifacts, then run JReleaser without publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v2\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || [[ "$RELEASE_TAG" == *SNAPSHOT* ]]; then
            echo "Expected a release tag such as v2.3.15 or v2.4.0-rc.1"
            exit 1
          fi
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "BUILD_TIMESTAMP=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare PomChecker
        timeout-minutes: 5
        run: bash .github/scripts/setup-pomchecker.sh

      - name: Verify, sign and stage artifacts locally
        env:
          MAVEN_GPG_KEY: ${{ secrets.SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAVEN_GPG_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"
          ./mvnw -B -ntp -Prelease -Drevision="$VERSION" \
            -Dproject.build.outputTimestamp="$BUILD_TIMESTAMP" -Dgpg.signer=bc \
            -DaltDeploymentRepository="staging::file://${GITHUB_WORKSPACE}/target/staging-deploy" \
            clean deploy

      - name: Check source tree
        run: git diff --exit-code

      - name: Publish with JReleaser
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          JRELEASER_GITHUB_TOKEN: ${{ secrets.JRELEASER_GITHUB_TOKEN || github.token }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVENCENTRAL_USERNAME }}
          JRELEASER_MAVENCENTRAL_TOKEN: ${{ secrets.MAVENCENTRAL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -B -ntp -N -Drevision="$VERSION" \
            -Djreleaser.dry.run="$DRY_RUN" jreleaser:full-release

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports
          path: ksef-client/target/surefire-reports/
          if-no-files-found: ignore
